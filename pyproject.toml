[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-aeon"
version = "0.1.0"
description = "Motor base para 'Pokémon: Continente Unificado', un fan-game que fusiona las tramas de Kanto/Johto, Hoenn, Sinnoh, Teselia y Kalos."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pokemon-aeon-demo = "pokemon_aeon.main:main"
